[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-run-macro"
version = "0.1.0"
description = "Render SQL-generating dbt package macros from Python or the command line."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andres Velasco"}]
dependencies = [
  "dbt-core>=1.10.11,<1.11",
  "filelock>=3.16,<4",
  "Jinja2>=3.1.6,<4",
  "packaging>=25,<27",
  "platformdirs>=4,<5",
  "PyYAML>=6,<7",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
bigquery = ["dbt-bigquery>=1.10.2,<1.11"]

[project.scripts]
dbt-run-macro = "dbt_run_macro.cli:main"

[project.urls]
Repository = "https://github.com/datooine/dbt-run-macro"

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
